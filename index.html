<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menus de la semaine</title>
<meta name="description" content="Menus et programme de la semaine">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍲</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f1e8;
    --paper: #fffdf8;
    --ink: #2b2620;
    --muted: #7a7064;
    --line: #e7dfd2;
    --accent: #c8553d;
    --accent-soft: #f6e1d9;
    --prog: #3d6b5a;
    --prog-soft: #e1eee7;
    --note: #8a6d1f;
    --note-soft: #faf1d6;
    --shadow: 0 1px 2px rgba(60,40,20,.06), 0 4px 16px rgba(60,40,20,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1916;
      --paper: #252220;
      --ink: #f1ebe2;
      --muted: #a69c8f;
      --line: #3a3530;
      --accent: #e8836b;
      --accent-soft: #43302a;
      --prog: #8cc5ad;
      --prog-soft: #263830;
      --note: #e2c36f;
      --note-soft: #3a3322;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 Inter, system-ui, sans-serif;
  }
  main { max-width: 1280px; margin: 0 auto; padding: 32px 16px 48px; }
  header { margin-bottom: 28px; }
  h1 {
    font-family: Fraunces, Georgia, serif;
    font-weight: 700;
    font-size: clamp(2rem, 5vw, 3rem);
    line-height: 1.1;
    margin: 0 0 6px;
  }
  .sub { color: var(--muted); margin: 0; font-size: 1.05rem; }

  .week {
    display: grid;
    gap: 14px;
    grid-template-columns: repeat(7, minmax(0, 1fr));
  }
  @media (max-width: 1100px) { .week { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 760px)  { .week { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 480px)  { .week { grid-template-columns: 1fr; } }

  .day {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 16px 18px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 220px;
  }
  .day.today { border: 2px solid var(--accent); }
  .day.past { opacity: .55; }
  .day-head { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .day-name { font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 1.35rem; }
  .day-date { color: var(--muted); font-size: .9rem; }
  .badge {
    background: var(--accent); color: #fff; font-size: .7rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 99px;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: var(--prog-soft); color: var(--prog);
    font-weight: 600; font-size: .85rem; padding: 3px 10px; border-radius: 99px;
  }

  .meal-label {
    font-size: .72rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: .08em; color: var(--accent); margin: 0 0 4px;
  }
  .meal ul { list-style: none; margin: 0; padding: 0; }
  .meal li { padding: 2px 0; }
  .meal li:first-child { font-weight: 600; }
  .empty { color: var(--muted); font-style: italic; font-size: .9rem; }

  .notes {
    margin-top: auto;
    background: var(--note-soft); color: var(--note);
    border-radius: 10px; padding: 8px 10px; font-size: .85rem;
  }
  .notes p { margin: 0; }
  .notes p + p { margin-top: 2px; }

  footer { margin-top: 32px; color: var(--muted); font-size: .85rem; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Menus de la semaine</h1>
    <p class="sub" id="range"></p>
  </header>
  <section class="week" id="week"></section>
  <footer>Mis à jour chaque semaine 🍲</footer>
</main>

<script src="semaine.js"></script>
<script>
  (function () {
    const NOMS = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];
    const data = window.SEMAINE;
    const [y, m, d] = data.debut.split("-").map(Number);
    const lundi = new Date(y, m - 1, d);
    const fmt = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "long" });
    const fmtShort = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short" });

    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const dimanche = new Date(y, m - 1, d + 6);
    document.getElementById("range").textContent =
      "Du " + fmt.format(lundi) + " au " + fmt.format(dimanche) + " " + dimanche.getFullYear();

    const el = (tag, cls, text) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    };

    const meal = (label, plats) => {
      const box = el("div", "meal");
      box.append(el("p", "meal-label", label));
      const ul = el("ul");
      plats.forEach(p => ul.append(el("li", null, p)));
      box.append(ul);
      return box;
    };

    const week = document.getElementById("week");
    data.jours.forEach((j, i) => {
      const date = new Date(y, m - 1, d + i);
      const card = el("article", "day");
      if (date.getTime() === today.getTime()) card.classList.add("today");
      else if (date < today) card.classList.add("past");

      const head = el("div", "day-head");
      const left = el("div");
      left.append(el("div", "day-name", NOMS[i]), el("div", "day-date", fmtShort.format(date)));
      if (card.classList.contains("today")) head.append(el("span", "badge", "Aujourd'hui"));
      head.append(left);
      card.append(head);

      if (j.programme && j.programme.length) {
        const chips = el("div", "chips");
        j.programme.forEach(p => chips.append(el("span", "chip", p)));
        card.append(chips);
      }

      const hasMidi = j.midi && j.midi.length;
      const hasSoir = j.soir && j.soir.length;
      if (hasMidi) card.append(meal("Midi", j.midi));
      if (hasSoir) card.append(meal(hasMidi ? "Soir" : "Au menu", j.soir));
      if (!hasMidi && !hasSoir) card.append(el("p", "empty", "Pas de menu prévu"));

      if (j.notes && j.notes.length) {
        const notes = el("div", "notes");
        j.notes.forEach(n => notes.append(el("p", null, n)));
        card.append(notes);
      }
      week.append(card);
    });
  })();
</script>
</body>
</html>
